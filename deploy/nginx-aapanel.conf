# BharatPlay – Nginx rules (aaPanel / any Nginx server)
#
# Nginx does NOT read .htaccess files. Without these rules premium videos,
# database.sql and logs can be downloaded directly.
#
# aaPanel: Website → your site → "URL rewrite" (Rewrite) tab → paste everything
# below → Save. (Or Conf tab, inside the server { } block.)

# Upload size per request (videos are sent in 8 MB parts, 64m leaves headroom)
client_max_body_size 64m;

# ^~ = these win over aaPanel's PHP location, so nothing here can be run or downloaded
location ^~ /config/        { deny all; }
location ^~ /includes/      { deny all; }
location ^~ /logs/          { deny all; }
location ^~ /cron/          { deny all; }
location ^~ /deploy/        { deny all; }
location ^~ /admin/includes/ { deny all; }
location ^~ /app/includes/  { deny all; }
location ^~ /uploads/tmp/   { deny all; }
# Videos are only served through /api/video-stream.php (login + premium check)
location ^~ /uploads/videos/ { deny all; }

# Thumbnails are public images, but never executable
location ^~ /uploads/thumbnails/ {
    location ~* \.(php|phtml|phar|pl|py|cgi|sh)$ { deny all; }
    expires 30d;
}

# Dumps, docs, backups, ini/env files. (.well-known stays open for SSL certificates.)
location ~* \.(sql|md|lock|log|bak|ini|sh|env)$ { deny all; }
location ~ /\.(?!well-known) { deny all; }

# (Video streaming disables Nginx buffering itself via the X-Accel-Buffering header.)

# Security headers (CSP is sent by PHP per page)
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
